<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitSearch | Find Repositories & Developers</title>
  <base href="/">
  
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="A powerful search tool to explore GitHub repositories, users, and organizations seamlessly.">
  <meta name="theme-color" content="#1976d2">

  <meta property="og:type" content="website">
  <meta property="og:title" content="GitSearch - Discover GitHub">
  <meta property="og:description" content="Search through millions of GitHub projects with ease.">
  <meta property="og:image" content="assets/social-preview.png">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <style>
    /* Inline CSS for the "Shell" - improves perceived performance */
    body, html { height: 100%; margin: 0; font-family: 'Roboto', sans-serif; }
    .app-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <app-root>
    <div class="app-loading">
      <div class="spinner"></div>
      <p style="margin-top: 15px; color: #555;">Initializing GitSearch...</p>
    </div>
  </app-root>

  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
